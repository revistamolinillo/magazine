<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Molinillo Magazine</title>

    <link rel="icon" type="image/png" href="assets/img/favicon.jpg">

    <meta name="description"
        content="Revista digital del IES El Molinillo">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2563eb">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title"
        content="El Molinillo Magazine">

    <link rel="stylesheet" href="css/styles.css">
</head>

    <meta name="google-site-verification" content="GlAPUmqOcGEpPl8dBUzAiuJpEE4Qh0jj1oSgQpOOGdY" />

<body>
    <div id="pantalla-carga">

        <div class="carga-contenido">

            <div class="carga-logo">
                EL MOLINILLO
                <span>MAGAZINE</span>
            </div>

            <div class="carga-linea"></div>

            <p class="carga-texto">
                Preparando revista...
            </p>

            <div class="carga-puntos">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>

    <div id="app">
    </div>

    <div id="lightbox" class="lightbox">

        
        <span class="cerrar-lightbox" onclick="cerrarLightbox()">
            &times;
        </span>

        <span class="flecha-galeria izquierda"
            onclick="imagenAnterior(event)">
            &#10094;
        </span>

        <img
            id="imagenLightbox"
            class="lightbox-img"
        >

        <span class="flecha-galeria derecha"
            onclick="imagenSiguiente(event)">
            &#10095;
        </span>


        <div id="contadorGaleria" class="contador-galeria">
        </div>


    </div>

    <div id="app">

    </div>

        <script src="data/config.js"></script>
        <script src="data/estado.js"></script>

        <script src="js/multimedia.js"></script>
        <script src="js/galeria.js"></script>

        <script src="js/render.js"></script>
        <script src="js/renderNoticias.js"></script>
        <script src="js/renderPodcasts.js"></script>

        <script src="js/vistas.js"></script>
        <script src="js/app.js"></script>
        <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register(
                    "./service-worker.js"
                )
                .then(registration => {

                    console.log(
                        "Service Worker registrado:",
                        registration.scope
                    );

                })
                .catch(error => {

                    console.error(
                        "Error registrando Service Worker:",
                        error
                    );

                });

            });

        }
        </script>

</body>

</html>
